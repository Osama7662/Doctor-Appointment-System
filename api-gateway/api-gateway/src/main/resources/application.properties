# API GATEWAY CONFIGURATION

spring.application.name=api-gateway
server.port=8080

# EUREKA CLIENT CONFIGURATION

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# GATEWAY SERVICE DISCOVERY

spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# USER SERVICE ROUTE

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/u1/user/**

# ADMIN ROUTE

spring.cloud.gateway.server.webflux.routes[1].id=admin-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/u1/admin/**

# DOCTOR SERVICE ROUTE

spring.cloud.gateway.server.webflux.routes[2].id=doctor-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://doctor-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/doctors/**

# APPOINTMENT SERVICE ROUTE

spring.cloud.gateway.server.webflux.routes[3].id=appointment-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://appointment-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/appointment/**

# ACTUATOR CONFIGURATION

management.endpoint.gateway.enabled=true
management.endpoints.web.exposure.include=health,gateway

# DEBUG LOGGING

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG

jwt.secret=${JWT_SECRET}
